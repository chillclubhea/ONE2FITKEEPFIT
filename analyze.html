<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代謝修復專家 - 客戶專屬分析報告系統</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-light: #f1f5f9;
            --text-gray: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'M PLUS Rounded 1c', sans-serif; }
        body { background: var(--bg-dark); color: var(--text-light); padding: 20px; min-height: 100vh; }

        /* 控制台頭部 */
        .admin-controls {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .selector-group label { color: var(--text-gray); margin-right: 10px; }
        select { padding: 10px 20px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; }

        /* 標籤切換 */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            padding: 12px 25px;
            background: var(--bg-panel);
            color: var(--text-gray);
            border: 1px solid #334155;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .tab-btn:hover:not(.active) { background: #334155; }

        /* 報告容器 */
        .report-container { display: none; animation: fadeIn 0.5s; }
        .report-container.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* === 初步報告樣式 (Admin View) === */
        .prelim-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .admin-card {
            background: white;
            color: #1e293b;
            padding: 25px;
            border-radius: 16px;
            border-left: 5px solid var(--primary);
        }

        .risk-card { border-left-color: var(--danger); }
        .value-card { border-left-color: var(--success); }

        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-right: 5px;
            margin-bottom: 5px;
            background: #e2e8f0;
            color: #475569;
        }
        
        .tag.urgent { background: #fee2e2; color: #991b1b; }

        /* === 詳細報告樣式 (Client View) === */
        .detail-view {
            background: white;
            color: #333;
            border-radius: 20px;
            overflow: hidden;
            max-width: 1000px;
            margin: 0 auto;
        }

        .detail-header {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .detail-body { padding: 40px; }
        
        .radar-box { height: 350px; margin: 30px auto; max-width: 600px; }

        .analysis-block {
            background: #f8fafc;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary);
        }

        .root-cause-title {
            color: #1e3a8a;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .action-list li { margin-bottom: 10px; padding-left: 20px; position: relative; }
        .action-list li::before {
            content: "✓"; color: var(--success); position: absolute; left: 0; font-weight: bold;
        }

        /* 打印按鈕 */
        .action-bar {
            text-align: right; margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 20px;
        }
        .btn-print {
            background: #475569; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="admin-controls">
        <div class="selector-group">
            <label><i class="fas fa-users"></i> 選擇客戶檔案 ID：</label>
            <select id="clientSelector" onchange="loadClientData()">
                </select>
        </div>
        <div>
            <span style="color: var(--text-gray); font-size: 0.9rem;">系統狀態：</span>
            <span style="color: var(--success);"><i class="fas fa-circle" style="font-size: 0.6rem;"></i> 數據已就緒</span>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('prelim')">📊 初步評估報告 (Admin)</button>
        <button class="tab-btn" onclick="switchTab('detail')">📑 詳細深度報告 (Client)</button>
    </div>

    <div id="prelim" class="report-container active">
        <div class="prelim-grid">
            <div class="admin-card value-card">
                <h3><i class="fas fa-wallet"></i> 客戶價值評估</h3>
                <div style="margin-top: 15px;">
                    <p><strong>投資意願：</strong> <span id="p-invest"></span></p>
                    <p><strong>決心程度：</strong> <span id="p-commit"></span></p>
                    <p><strong>預估轉化率：</strong> <span id="p-score" style="font-size: 1.5rem; font-weight: bold;"></span></p>
                    <div style="margin-top: 15px; padding: 10px; background: #f0fdf4; border-radius: 8px; color: #166534; font-size: 0.9rem;">
                        <i class="fas fa-lightbulb"></i> 銷售建議：<span id="p-advice"></span>
                    </div>
                </div>
            </div>

            <div class="admin-card risk-card">
                <h3><i class="fas fa-notes-medical"></i> 代謝風險快篩</h3>
                <div style="margin-top: 15px;">
                    <p><strong>BMI/腰圍風險：</strong> <span id="p-body-risk"></span></p>
                    <p><strong>壓力指數：</strong> <span id="p-stress"></span></p>
                    <div style="margin-top: 10px;">
                        <strong>關鍵症狀：</strong>
                        <div id="p-symptoms-tags" style="margin-top: 5px;"></div>
                    </div>
                </div>
            </div>

            <div class="admin-card">
                <h3><i class="fas fa-bullseye"></i> 核心痛點摘要</h3>
                <div style="margin-top: 15px; font-size: 0.95rem; line-height: 1.6;">
                    <p style="color: #64748b; margin-bottom: 5px;">客戶原話：</p>
                    <p id="p-pain" style="font-style: italic; background: #f1f5f9; padding: 10px; border-radius: 8px;"></p>
                    <p style="margin-top: 15px;"><strong>過往失敗經驗：</strong> <span id="p-history"></span></p>
                </div>
            </div>
        </div>
    </div>

    <div id="detail" class="report-container">
        <div class="detail-view">
            <div class="detail-header">
                <h2>METABOLIC ROOT CAUSE ANALYSIS</h2>
                <h1 style="font-size: 2.5rem; margin: 10px 0;">代謝根源深度分析報告</h1>
                <p>專屬 ID: <span id="d-id"></span> | 客戶: <span id="d-name"></span></p>
            </div>

            <div class="detail-body">
                <div style="text-align: center; margin-bottom: 40px;">
                    <h3 style="color: #1e3a8a;">您的「代謝五維度」檢測圖</h3>
                    <p style="color: #64748b;">透過數據化分析，找出拖垮您代謝的短板</p>
                    <div class="radar-box">
                        <canvas id="metabolicRadar"></canvas>
                    </div>
                </div>

                <h3 style="border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 20px; color: #333;">
                    <i class="fas fa-stethoscope"></i> 專家診斷結果
                </h3>

                <div id="dynamic-analysis">
                    </div>

                <div class="analysis-block" style="border-left-color: var(--success); background: #f0fdf4;">
                    <div class="root-cause-title" style="color: #166534;">
                        <i class="fas fa-clipboard-check"></i> 您的第一階段微調方案
                    </div>
                    <ul class="action-list" id="action-plan">
                        </ul>
                </div>

                <div class="action-bar">
                    <button class="btn-print" onclick="window.print()"><i class="fas fa-print"></i> 列印報告 / 存為 PDF</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 數據源模擬 (模擬從 LocalStorage 獲取)
        // ==========================================
        const mockClients = [
            {
                id: 'MET2602038821',
                igName: 'sarah_fitness',
                investment: '願意投資',
                commitment: '非常堅定',
                stress_level: 9,
                sleep_hours: '<5小時',
                waist: 85,
                gender: '女',
                symptoms: ['渴望甜食', '腹部肥胖', '下午疲勞'],
                problem: '產後肚子一直瘦不下來，即使少吃也沒用，下午很想吃麵包。',
                methods: ['168斷食', '節食'],
                water: '<1L',
                morning_energy: '非常疲憊'
            },
            {
                id: 'MET2602034451',
                igName: 'jason_ceo',
                investment: '願意投資',
                commitment: '願意嘗試',
                stress_level: 6,
                sleep_hours: '5-6小時',
                waist: 98,
                gender: '男',
                symptoms: ['易水腫', '食慾不穩定'],
                problem: '醫生說內臟脂肪過高，工作應酬多，沒時間運動。',
                methods: ['無'],
                water: '1-2L',
                morning_energy: '尚可'
            },
            {
                id: 'MET2602029982',
                igName: 'student_emily',
                investment: '無法投資',
                commitment: '需要觀望',
                stress_level: 3,
                sleep_hours: '7-8小時',
                waist: 65,
                gender: '女',
                symptoms: ['手腳冰冷'],
                problem: '想讓線條更好看，目前不胖但體脂高。',
                methods: ['有氧運動'],
                water: '>2L',
                morning_energy: '精神飽滿'
            }
        ];

        let currentClient = null;
        let radarChart = null;

        // ==========================================
        // 2. 初始化與事件
        // ==========================================
        window.onload = function() {
            // 填充下拉選單
            const selector = document.getElementById('clientSelector');
            
            // 嘗試讀取 LocalStorage，如果沒有則使用模擬數據
            const localData = JSON.parse(localStorage.getItem('metabolic_appointments'));
            const dataToUse = localData && localData.length > 0 ? localData : mockClients;

            dataToUse.forEach((client, index) => {
                const option = document.createElement('option');
                option.value = index; // 使用索引來選取
                // 將數據存儲在 DOM 元素中以便讀取
                option.dataset.client = JSON.stringify(client);
                option.text = `${client.id} - ${client.igName} (${client.investment})`;
                selector.add(option);
            });

            // 載入第一位客戶
            loadClientData();
        };

        function switchTab(tabId) {
            document.querySelectorAll('.report-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // ==========================================
        // 3. 核心邏輯：載入並生成報告
        // ==========================================
        function loadClientData() {
            const selector = document.getElementById('clientSelector');
            const selectedOption = selector.options[selector.selectedIndex];
            currentClient = JSON.parse(selectedOption.dataset.client);

            console.log("載入客戶數據:", currentClient);

            // 生成兩份報告
            generatePreliminaryReport(currentClient);
            generateDetailedReport(currentClient);
        }

        // --- 生成初步報告 (Admin) ---
        function generatePreliminaryReport(data) {
            // 投資意願
            const invEl = document.getElementById('p-invest');
            invEl.textContent = data.investment;
            invEl.style.color = data.investment === '願意投資' ? 'var(--success)' : 'var(--danger)';

            document.getElementById('p-commit').textContent = data.commitment;
            
            // 計算成交分 (簡易算法)
            let score = 50;
            if(data.investment === '願意投資') score += 30;
            if(data.investment === '可能投資') score += 10;
            if(data.commitment === '非常堅定') score += 20;
            if(data.stress_level > 7) score += 10; // 痛點高
            
            const scoreEl = document.getElementById('p-score');
            scoreEl.textContent = score + '%';
            scoreEl.style.color = score > 80 ? 'var(--success)' : (score > 60 ? 'var(--warning)' : 'var(--text-gray)');

            // 銷售建議
            let advice = "標準跟進流程";
            if (score > 80) advice = "🔥 高優先級！直接預約深度諮詢，強調「根源解決」。";
            else if (data.investment === '無法投資') advice = "轉入社群培育，提供免費素材，勿花過多時間。";
            else advice = "需要教育。發送成功案例，建立信任感。";
            document.getElementById('p-advice').textContent = advice;

            // 風險評估
            let bodyRisk = "低";
            const waistLimit = data.gender === '男' ? 90 : 80;
            if (parseInt(data.waist) > waistLimit) bodyRisk = "⚠️ 高 (內臟脂肪風險)";
            document.getElementById('p-body-risk').textContent = bodyRisk;
            
            document.getElementById('p-stress').textContent = data.stress_level + '/10';

            // 症狀標籤
            const tagsContainer = document.getElementById('p-symptoms-tags');
            tagsContainer.innerHTML = '';
            (data.symptoms || []).forEach(sym => {
                const span = document.createElement('span');
                span.className = 'tag urgent';
                span.textContent = sym;
                tagsContainer.appendChild(span);
            });

            // 痛點
            document.getElementById('p-pain').textContent = `"${data.problem}"`;
            document.getElementById('p-history').textContent = (data.methods || []).join(', ') || '無';
        }

        // --- 生成詳細報告 (Client) ---
        function generateDetailedReport(data) {
            document.getElementById('d-id').textContent = data.id;
            document.getElementById('d-name').textContent = data.igName;

            // 1. 更新雷達圖
            updateRadarChart(data);

            // 2. 生成動態分析文案 (邏輯引擎)
            const analysisContainer = document.getElementById('dynamic-analysis');
            analysisContainer.innerHTML = ''; // 清空

            // 規則 1: 壓力型
            if (parseInt(data.stress_level) >= 7) {
                analysisContainer.innerHTML += createAnalysisBlock(
                    '⚠️ 隱性壓力荷爾蒙 (Cortisol) 失衡',
                    `檢測顯示您的壓力指數高達 ${data.stress_level}/10。長期高皮質醇會導致「假性飢餓」並直接命令身體分解肌肉、堆積腹部脂肪。這解釋了為什麼您提到「${data.problem.substring(0, 10)}...」的問題。`
                );
            }

            // 規則 2: 睡眠不足
            if (data.sleep_hours === '<5小時' || data.sleep_hours === '5-6小時') {
                analysisContainer.innerHTML += createAnalysisBlock(
                    '💤 夜間代謝修復受阻',
                    '睡眠不足會導致「瘦素(Leptin)」下降與「飢餓素(Ghrelin)」上升。數據顯示您的睡眠時間不足，這會導致隔天基礎代謝率下降 5-10%，並且更渴望高糖食物。'
                );
            }

            // 規則 3: 胰島素/飲食
            if ((data.symptoms || []).includes('渴望甜食') || (data.symptoms || []).includes('腹部肥胖')) {
                analysisContainer.innerHTML += createAnalysisBlock(
                    '🍞 胰島素阻抗 (Insulin Resistance) 傾向',
                    '您的症狀（腹部囤積、渴望澱粉）強烈指向血糖波動問題。這代表您的細胞對胰島素不敏感，導致能量無法被利用，反而全部轉化為脂肪儲存。'
                );
            }

            // 規則 4: 基礎代謝 (如果都沒有上述嚴重問題)
            if (analysisContainer.innerHTML === '') {
                analysisContainer.innerHTML += createAnalysisBlock(
                    '🔥 基礎代謝效率評估',
                    '雖然沒有極端的風險指標，但目前的代謝處於「停滯期」。需要透過特定的飲食微調來重新啟動粒線體燃脂功能。'
                );
            }

            // 3. 生成行動方案
            const actionList = document.getElementById('action-plan');
            actionList.innerHTML = '';
            
            let actions = [];
            // 根據數據推導建議
            if (parseInt(data.stress_level) >= 7) {
                actions.push('<strong>優先降壓：</strong> 暫停高強度有氧，改為每日 15 分鐘呼吸練習或瑜伽，降低皮質醇。');
                actions.push('<strong>補充鎂元素：</strong> 建議晚餐後補充甘胺酸鎂，幫助神經放鬆與代謝壓力。');
            }
            if ((data.symptoms || []).includes('渴望甜食')) {
                actions.push('<strong>早餐調整：</strong> 絕對避免純澱粉早餐（麵包/果汁）。改為「高蛋白+好油脂」（如雞蛋+酪梨），穩定整日血糖。');
            }
            if (data.water === '<1L') {
                actions.push('<strong>基礎水合：</strong> 您的飲水量嚴重不足，請設定鬧鐘每小時喝 200ml 水，這是啟動脂肪分解的最基本條件。');
            }
            
            // 填充建議
            if (actions.length === 0) actions.push('建議預約一對一諮詢以獲取詳細方案。');
            
            actions.forEach(act => {
                actionList.innerHTML += `<li>${act}</li>`;
            });
        }

        function createAnalysisBlock(title, content) {
            return `
                <div class="analysis-block">
                    <div class="root-cause-title">${title}</div>
                    <p style="color: #475569; line-height: 1.6;">${content}</p>
                </div>
            `;
        }

        // --- 雷達圖繪製 ---
        function updateRadarChart(data) {
            const ctx = document.getElementById('metabolicRadar').getContext('2d');
            
            // 計算分數 (反向邏輯：問題越大分數越低)
            const stressScore = 10 - parseInt(data.stress_level);
            let sleepScore = 5;
            if (data.sleep_hours === '>8小時') sleepScore = 9;
            else if (data.sleep_hours === '7-8小時') sleepScore = 10;
            else if (data.sleep_hours === '5-6小時') sleepScore = 6;
            else sleepScore = 3;

            const dietScore = (data.symptoms || []).includes('渴望甜食') ? 4 : 8;
            const energyScore = data.morning_energy === '精神飽滿' ? 9 : (data.morning_energy === '非常疲憊' ? 3 : 6);
            
            // 銷毀舊圖表
            if (radarChart) radarChart.destroy();

            radarChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['壓力調節', '睡眠品質', '飲食控制', '早晨能量', '代謝靈活度'],
                    datasets: [{
                        label: '您的代謝現況',
                        data: [stressScore, sleepScore, dietScore, energyScore, 6], // 最後一項為預設
                        backgroundColor: 'rgba(59, 130, 246, 0.2)',
                        borderColor: '#2563eb',
                        pointBackgroundColor: '#2563eb',
                        pointBorderColor: '#fff',
                        borderWidth: 2
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: { color: '#cbd5e1' },
                            grid: { color: '#cbd5e1' },
                            pointLabels: { font: { size: 14, family: "'M PLUS Rounded 1c'" }, color: '#334155' },
                            suggestedMin: 0,
                            suggestedMax: 10
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }
    </script>
</body>
</html>
